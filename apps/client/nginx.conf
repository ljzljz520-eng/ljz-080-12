server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # H5 用户端（家属 / 配送员）
    location = /h5.html {
        try_files $uri =404;
    }

    # PC 管理端（SPA 回退）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
